# Pinned Xtensa GCC (Espressif crosstool-NG build) of the ESP32-S3
# freestanding profile. The values match the xtensa-esp-elf entry of
# tools/tools.json in the ESP-IDF release pinned by JaszczurHAL, which checks
# that the two agree: the device archive of this profile links into ESP-IDF
# firmware built with that toolchain. Pins only; scripts/ensure_tools.sh
# installs it below .build/tools/xtensa-toolchain (Linux hosts only).
# The full asset name is ${STEM}-${host}.tar.xz, host x86_64-linux-gnu or
# aarch64-linux-gnu.
XTENSA_TOOLCHAIN_RELEASE_BASE=https://github.com/espressif/crosstool-NG/releases/download
XTENSA_TOOLCHAIN_VERSION=esp-15.2.0_20251204
XTENSA_TOOLCHAIN_ASSET_STEM=xtensa-esp-elf-15.2.0_20251204
XTENSA_TOOLCHAIN_GCC_MAJOR=15
XTENSA_TOOLCHAIN_SHA256_X86_64_LIN=3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8
XTENSA_TOOLCHAIN_SHA256_AARCH64_LIN=c8a8255009803036ba3def98a97a7134ee5a8ac5db048425e126fcf07f27ce1c
