# Pinned bare-metal RISC-V GCC (official Raspberry Pi prebuilt for RP2350
# Hazard3): the single source for jhbase and for JaszczurHAL, which reads
# this file from its pinned jhbase checkout. Pins only; each consumer chooses
# its own install directory (jhbase: .build/tools/riscv-toolchain via
# scripts/ensure_tools.sh, Linux hosts only). The v2.2.0-4 GCC 15 build stays
# pinned with Pico SDK 2.3.1, which still accepts the riscv32-unknown-elf
# triple; pico-sdk-tools v2.3.0-1 and later switch to GCC 16 and
# riscv32-pico-elf, which is a separate toolchain upgrade.
# The full asset name is ${STEM}-${arch}.${format}: Linux uses tar.gz, native
# Windows the x64-win ZIP of the same release.
RISCV_TOOLCHAIN_RELEASE_BASE=https://github.com/raspberrypi/pico-sdk-tools/releases/download
RISCV_TOOLCHAIN_TAG=v2.2.0-4
RISCV_TOOLCHAIN_ASSET_STEM=riscv-toolchain-15
RISCV_TOOLCHAIN_GCC_MAJOR=15
RISCV_TOOLCHAIN_TRIPLE=riscv32-unknown-elf
RISCV_TOOLCHAIN_SHA256_X86_64_LIN=813baded4ac345e169d8d1c7e242e38f28ebf95a8b9b386539fa023835d55589
RISCV_TOOLCHAIN_SHA256_AARCH64_LIN=2128e1b44a6259ce8c241255784a026a25c58ab64b9b2d2e567fb473e00c705f
RISCV_TOOLCHAIN_SHA256_X64_WIN=acfe0edfa1d57e0abca42a23524ac74b9b9d7c6887d9bf305ad2fa96937def2f
