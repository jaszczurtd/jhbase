# Oldest supported CMake (official Kitware build): every cmake_minimum_required
# of jhbase and JaszczurHAL declares this major.minor, and the gates configure
# both projects with exactly this release, so newer CMake features cannot slip
# in below the declared minimum. Pins only; each consumer chooses its own
# install directory (jhbase: .build/tools/cmake-minimum via
# scripts/ensure_tools.sh, Linux hosts only).
# The asset name is cmake-${VERSION}-linux-${arch}.tar.gz.
CMAKE_MINIMUM_RELEASE_BASE=https://github.com/Kitware/CMake/releases/download
CMAKE_MINIMUM_VERSION=3.22.0
CMAKE_MINIMUM_SHA256_X86_64_LIN=dc73115520d13bb64202383d3df52bc3d6bbb8422ecc5b2c05f803491cb215b0
CMAKE_MINIMUM_SHA256_AARCH64_LIN=fad31d923ccfca6202638df3995533ed3ce440fd67eb031d33cfd7c074b68e8c
